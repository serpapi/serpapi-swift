name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      
      - name: Verify Swift Version
        run: |
          swift --version
          SWIFT_VERSION=$(swift --version | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+')
          echo "Detected Swift version: $SWIFT_VERSION"
          MAJOR=$(echo $SWIFT_VERSION | cut -d. -f1)
          MINOR=$(echo $SWIFT_VERSION | cut -d. -f2)
          if [ "$MAJOR" -lt 6 ] || ([ "$MAJOR" -eq 6 ] && [ "$MINOR" -lt 2 ]); then
            echo "Error: Swift 6.2 or later is required, but found $SWIFT_VERSION"
            echo "Please update the Xcode version in the workflow or wait for GitHub Actions to provide Swift 6.2"
            exit 1
          fi
          echo "✓ Swift version $SWIFT_VERSION meets requirement (>= 6.2)"
      
      - name: Resolve Dependencies
        run: swift package resolve
      
      - name: Build
        run: swift build
      
      - name: Build Demo
        run: swift build --package-path Examples/Demo --product Demo
      
      # Integration tests skip themselves (XCTSkipIf) when SERPAPI_KEY is not available, e.g. on forks.
      - name: Test
        run: swift test
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

  # A separate job, so a lint failure never hides the build and test results.
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      # norio-nomura/action-swiftlint is a Docker action and cannot run on macOS runners.
      # SwiftLint is pinned so new upstream rules don't break CI unexpectedly, and its
      # SHA-256 is the release asset digest, so a replaced binary fails the job.
      - name: Lint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      
      - name: Run Tests with Coverage
        run: swift test --enable-code-coverage
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      # SwiftPM names the test bundle after the package (SerpApiPackageTests), not the test target.
      - name: Generate Coverage Report
        run: |
          bin_path=$(swift build --show-bin-path)
          xcrun llvm-cov report \
            "$bin_path/SerpApiPackageTests.xctest/Contents/MacOS/SerpApiPackageTests" \
            -instr-profile="$bin_path/codecov/default.profdata" \
            -ignore-filename-regex='.build|Tests'
